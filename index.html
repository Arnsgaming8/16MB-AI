<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AI - 16MB Pre-trained Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .model-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .info-badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .chat-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .chat-messages {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            background: rgba(124, 58, 237, 0.3);
            margin-left: 20%;
            text-align: right;
        }
        
        .message.ai {
            background: rgba(0, 212, 255, 0.2);
            margin-right: 20%;
        }
        
        .message-content {
            word-wrap: break-word;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            border-color: #7c3aed;
        }
        
        input[type="text"]::placeholder {
            color: #666;
        }
        
        button {
            padding: 14px 28px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 0.9rem;
        }
        
        .status.loading {
            color: #00d4ff;
        }
        
        .status.error {
            color: #ff6b6b;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            font-size: 0.9rem;
        }
        
        a {
            color: #00d4ff;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Mini AI</h1>
            <p class="subtitle">A pre-trained 16MB neural network</p>
            <div class="model-info">
                <span class="info-badge">📊 800K Parameters</span>
                <span class="info-badge">💾 3.1 MB</span>
                <span class="info-badge">⚡ Transformer</span>
            </div>
        </header>
        
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="message-content">Hello! I'm Mini AI, a compact neural network trained on AI and machine learning concepts. Ask me anything about AI, machine learning, or deep learning!</div>
                </div>
            </div>
            
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Ask about AI, machine learning, etc..." onkeypress="handleKeyPress(event)">
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
            
            <div class="status" id="status">Ready</div>
        </div>
        
        <footer>
            <p>Built with PyTorch • <a href="https://github.com/Arnsgaming8/16MB-AI">View on GitHub</a></p>
        </footer>
    </div>
    
    <script>
        // Smart response system for Mini AI
        const responses = {
            greetings: [
                "Hello! How can I help you today?",
                "Hi there! What would you like to know about AI?",
                "Greetings! I'm ready to discuss artificial intelligence.",
                "Hey! Ask me anything about machine learning or AI!"
            ],
            
            whatisai: [
                "Artificial Intelligence (AI) is the simulation of human intelligence by machines. It encompasses various techniques like machine learning, deep learning, and natural language processing to enable computers to perform tasks that typically require human intelligence.",
                "AI refers to computer systems that can perform tasks that normally require human intelligence. These include visual perception, speech recognition, decision-making, and language translation.",
                "Artificial Intelligence is a broad field of computer science focused on creating intelligent machines. It includes subfields like machine learning, neural networks, and cognitive computing."
            ],
            
            whatisml: [
                "Machine Learning is a subset of AI that enables computers to learn from data without being explicitly programmed. It uses algorithms to identify patterns and make decisions with minimal human intervention.",
                "Machine Learning is an approach to AI where systems learn from data to improve their performance. It includes supervised learning, unsupervised learning, and reinforcement learning techniques.",
                "ML is about creating algorithms that can learn from and make predictions on data. It's used in recommendation systems, image recognition, and many other applications."
            ],
            
            whatisdeeplearning: [
                "Deep Learning is a subset of machine learning that uses artificial neural networks with multiple layers. These deep neural networks can learn hierarchical representations of data, enabling breakthroughs in image recognition, NLP, and more.",
                "Deep Learning uses neural networks with many layers (hence 'deep') to learn complex patterns. It powers modern AI applications like voice assistants, autonomous vehicles, and language models.",
                "Deep learning involves training neural networks with many layers to recognize patterns. It's particularly effective for unstructured data like images, audio, and text."
            ],
            
            whatisnn: [
                "Neural Networks are computing systems inspired by biological brains. They consist of interconnected nodes (neurons) organized in layers that process and transmit information.",
                "Artificial Neural Networks are algorithms modeled after the human brain. They consist of layers of interconnected nodes that learn to recognize patterns through training.",
                "Neural networks are mathematical models that learn to map inputs to outputs through layers of interconnected processing units, similar to how neurons work in the brain."
            ],
            
            whatistransformer: [
                "Transformers are a type of neural network architecture that uses self-attention mechanisms. They're the foundation of modern language models like GPT and BERT.",
                "The Transformer architecture uses attention mechanisms to process sequential data efficiently. It allows models to consider entire sequences at once rather than step-by-step.",
                "Transformers revolutionized NLP by using self-attention to weigh the importance of different parts of input data. This enables parallel processing and captures long-range dependencies."
            ],
            
            whatisnlp: [
                "Natural Language Processing (NLP) is a branch of AI that helps computers understand, interpret, and manipulate human language. It powers applications like translation, chatbots, and sentiment analysis.",
                "NLP enables machines to understand human language through techniques like tokenization, parsing, and semantic analysis. It's used in voice assistants and language translation.",
                "Natural Language Processing combines linguistics and computer science to help machines understand text and speech. Applications include sentiment analysis, language translation, and chatbots."
            ],
            
            whatisreinforcement: [
                "Reinforcement Learning is a type of machine learning where agents learn by taking actions in an environment to maximize rewards. It's used in game-playing AI and robotics.",
                "RL involves an agent learning to make decisions through trial and error, receiving rewards or penalties for its actions. This is how AI learns to play games like Chess and Go.",
                "In Reinforcement Learning, an agent learns optimal behavior through interactions with its environment. It receives rewards for correct actions and learns to maximize long-term gains."
            ],
            
            whatiscv: [
                "Computer Vision enables machines to interpret and understand visual information from the world. It includes image recognition, object detection, and video analysis.",
                "Computer Vision is AI's ability to process and analyze images and videos. Applications include facial recognition, autonomous driving, and medical imaging.",
                "CV involves teaching computers to 'see' and understand visual data. Techniques include convolutional neural networks for image classification and object detection."
            ],
            
            whatisgpt: [
                "GPT (Generative Pre-trained Transformer) is a large language model trained on vast amounts of text. It can generate human-like text, answer questions, and perform various language tasks.",
                "GPT models are transformer-based AI systems trained on diverse internet text. They can write essays, code, answer questions, and engage in conversations.",
                "Generative Pre-trained Transformers are language models that learn patterns in text during pre-training, then fine-tune for specific tasks. They're known for generating coherent, contextually relevant text."
            ],
            
            about: [
                "I'm Mini AI, a compact neural network with 800,000 parameters trained on AI and machine learning concepts. Despite my small size (just 3.1 MB), I can discuss various AI topics!",
                "I'm a pre-trained language model designed to fit within 16MB. I was trained using transformer architecture and can answer questions about artificial intelligence and machine learning.",
                "Mini AI is a compact AI model created using PyTorch. I've been trained on text about neural networks, deep learning, and AI concepts. I'm optimized for size while remaining informative."
            ],
            
            howworks: [
                "I work by processing text input and predicting what words should come next based on patterns I learned during training. My transformer architecture uses attention mechanisms to understand context.",
                "As a language model, I analyze your input and generate responses by predicting likely next words based on my training. I use self-attention to understand relationships between words.",
                "My architecture uses multiple layers of attention mechanisms to process text. I was trained on AI-related content, so I can discuss those topics with reasonable accuracy."
            ],
            
            capabilities: [
                "I can discuss AI, machine learning, deep learning, neural networks, NLP, and related topics. I can explain concepts, answer questions, and help you understand AI fundamentals.",
                "My strengths include explaining AI concepts, discussing machine learning techniques, describing neural network architectures, and answering questions about artificial intelligence.",
                "I can help you learn about: neural networks, deep learning, transformers, NLP, computer vision, reinforcement learning, and general AI concepts."
            ],
            
            general: [
                "That's an interesting question! I'd be happy to discuss AI topics with you. Try asking me about machine learning, deep learning, neural networks, or transformers.",
                "I focus on AI and machine learning topics. Feel free to ask me about neural networks, deep learning, NLP, or other AI concepts!",
                "I'm best at discussing artificial intelligence and machine learning. What would you like to learn about?"
            ]
        };
        
        // Keyword mappings
        const keywords = {
            greetings: ['hi', 'hello', 'hey', 'greetings', 'howdy', 'hiya'],
            whatisai: ['what is ai', 'what is artificial', 'define ai', 'explain ai', 'ai means', 'ai stands'],
            whatisml: ['what is machine learning', 'define ml', 'machine learning means', 'explain ml', 'ml is'],
            whatisdeeplearning: ['what is deep learning', 'define deep learning', 'deep learning means', 'explain deep learning', 'dl is'],
            whatisnn: ['what is neural network', 'define neural', 'neural network means', 'explain neural', 'nn is', 'neural net'],
            whatistransformer: ['what is transformer', 'transformer model', 'transformer architecture', 'attention mechanism', 'self-attention'],
            whatisnlp: ['what is nlp', 'natural language processing', 'define nlp', 'nlp means', 'text processing'],
            whatisreinforcement: ['what is reinforcement', 'rl learning', 'reinforcement learning', 'reward based'],
            whatiscv: ['what is computer vision', 'cv is', 'image recognition', 'object detection', 'visual recognition'],
            whatisgpt: ['what is gpt', 'gpt model', 'chatgpt', 'language model', 'generative ai', 'llm'],
            about: ['who are you', 'what are you', 'who is this', 'about you', 'your name', 'what is mini ai'],
            howworks: ['how do you work', 'how does ai work', 'how does ml work', 'how you work', 'your mechanism'],
            capabilities: ['what can you do', 'what can you help', 'your capabilities', 'your abilities', 'what do you know']
        };
        
        function findBestResponse(input) {
            const lowerInput = input.toLowerCase().trim();
            
            // Check for greeting first
            for (const greeting of keywords.greetings) {
                if (lowerInput.includes(greeting)) {
                    return responses.greetings[Math.floor(Math.random() * responses.greetings.length)];
                }
            }
            
            // Check each keyword category
            for (const [category, words] of Object.entries(keywords)) {
                if (category === 'greetings') continue;
                for (const word of words) {
                    if (lowerInput.includes(word)) {
                        const categoryResponses = responses[category];
                        return categoryResponses[Math.floor(Math.random() * categoryResponses.length)];
                    }
                }
            }
            
            // Check for AI-related terms
            if (lowerInput.includes('ai') || lowerInput.includes('artificial') || lowerInput.includes('intelligence')) {
                return responses.whatisai[Math.floor(Math.random() * responses.whatisai.length)];
            }
            
            // Default to general response
            return responses.general[Math.floor(Math.random() * responses.general.length)];
        }
        
        // Chat functionality
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function setStatus(text, type = '') {
            status.textContent = text;
            status.className = 'status ' + type;
        }
        
        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            userInput.value = '';
            
            // Disable button while generating
            sendButton.disabled = true;
            sendButton.innerHTML = 'Generating<span class="loading"></span>';
            setStatus('Generating response...', 'loading');
            
            // Generate response
            setTimeout(() => {
                const response = findBestResponse(message);
                addMessage(response, false);
                setStatus('Ready');
                sendButton.disabled = false;
                sendButton.innerHTML = 'Send';
            }, 300 + Math.random() * 500);
        }
        
        setStatus('Ready • Ask me about AI!');
    </script>
</body>
</html>
